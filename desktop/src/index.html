<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Cypy Manga Translator</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="bg-gradient"></div>

    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar glass-panel">
        <div class="logo-container">
          <div class="logo-text">
            <h2>Cypy</h2>
            <button id="settings-btn" class="icon-btn" title="Advanced Settings">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p>Manga Translator</p>
        </div>
        
        <div class="settings-group">
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="gemini">Google Gemini</option>
            <option value="openai">OpenAI</option>
            <option value="openrouter">OpenRouter</option>
            <option value="zen">Zen (opencode.ai)</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="settings-group">
          <label for="model" style="display: flex; align-items: center; justify-content: space-between;">
            <span>Model <span class="info-icon" data-tooltip="Ketik nama model secara manual atau pilih dari daftar dropdown."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></span>
            <button id="model-docs-btn" class="icon-btn-small" style="padding: 2px;" title="Lihat Daftar Model Resmi">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            </button>
          </label>
          <input type="text" id="model" list="model-list" placeholder="Loading..." />
          <datalist id="model-list">
             <option value="gemini-3.1-flash-lite"></option>
             <option value="gemini-1.5-pro"></option>
             <option value="gpt-5.4"></option>
             <option value="qwen/qwen2.5-vl-72b-instruct:free"></option>
             <option value="minimax-m3-free"></option>
          </datalist>
        </div>

        <div class="settings-group">
          <label for="language-select">Target Language</label>
          <select id="language-select">
            <option value="Indonesian">Indonesian</option>
            <option value="English">English</option>
            <option value="Japanese">Japanese</option>
            <option value="Mandarin">Mandarin</option>
            <option value="Spanish">Spanish</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Javanese">Javanese</option>
            <option value="custom">Type your own...</option>
          </select>
          <input type="text" id="language-custom" placeholder="e.g. Arabic" class="hidden mt-2" />
        </div>
        
        <div class="sidebar-spacer"></div>
        <button id="translate-btn" class="primary-btn" disabled>Translate</button>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <div class="upload-area glass-panel" id="drop-zone">
          <div class="upload-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          </div>
          <h3>Drag & Drop Image or Folder</h3>
          <p>or click to browse</p>
          <input type="file" id="file-input" accept="image/*" multiple hidden />
        </div>

        <!-- Single Image Preview -->
        <div class="preview-area glass-panel hidden" id="preview-single">
          <div class="preview-pane">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <h4 style="margin: 0;">Original</h4>
              <button id="change-image-btn" class="icon-btn-small" style="display: flex; gap: 4px; align-items: center; cursor: pointer; padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                Change
              </button>
            </div>
            <div class="img-container">
              <img id="image-original" src="" alt="Original" />
            </div>
          </div>
          <div class="preview-pane">
            <h4>Translated</h4>
            <div class="img-container">
              <img id="image-translated" src="" style="opacity:0.3" alt="" />
              <div class="loading-overlay hidden" id="loading-overlay">
                <div class="spinner"></div>
                <div class="status-text" id="status-text">Processing...</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Batch Thumbnail Gallery (Bottom) -->
    <div class="gallery-panel glass-panel hidden" id="gallery-panel">
       <!-- thumbnails injected here -->
    </div>

    <!-- Advanced Settings Modal -->
    <div class="modal-backdrop hidden" id="settings-modal">
      <div class="modal-content glass-panel">
        <div class="modal-header">
          <h3>Advanced Settings</h3>
          <button id="close-modal-btn" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="settings-group">
            <label id="api-key-label" for="api-key">API Key (Leave empty to use default from .env)</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="api-key" placeholder="••••••••••••••••••••••••" style="padding-right: 40px;" />
              <button id="toggle-api-key-btn" class="icon-btn-small" style="position: absolute; right: 8px;" title="Show/Hide">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          
          <div class="tweak-grid">
            <div class="settings-group">
              <label for="sfx_mode">SFX Filter Mode <span class="info-icon" data-tooltip="Tingkat agresivitas menghapus teks (SFX) / background. (Default: seimbang)&#10;Effect: 'ketat' = rawan kena teks asli, 'longgar' = aman tapi sampah ikut."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <select id="sfx_mode">
                <option value="longgar">Longgar (Safe)</option>
                <option value="seimbang">Seimbang (Balanced)</option>
                <option value="ketat">Ketat (Aggressive)</option>
              </select>
            </div>
            
            <div class="settings-group checkbox-group">
              <label class="toggle">
                <input type="checkbox" id="patch_gepeng">
                <span class="slider"></span>
              </label>
              <span>Patch Gepeng <span class="info-icon" data-tooltip="Timpa teks yang sangat panjang (gepeng) dengan kotak putih. (Default: On)&#10;Effect: Matikan jika garis border komik sering ikut tertimpa."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></span>
            </div>

            <div class="settings-group">
              <label for="pad_x">Pad X Ratio (<span id="val_pad_x">0.40</span>) <span class="info-icon" data-tooltip="Rasio kelonggaran potongan gambar balon teks (kiri-kanan). (Default: 0.40)&#10;Effect: Makin besar mencegah kepotong, tapi rawan menabrak teks sebelah."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <input type="range" id="pad_x" min="0" max="1.5" step="0.05" value="0.40">
            </div>

            <div class="settings-group">
              <label for="pad_y">Pad Y Ratio (<span id="val_pad_y">0.25</span>) <span class="info-icon" data-tooltip="Rasio kelonggaran potongan gambar (atas-bawah). (Default: 0.25)&#10;Effect: Makin besar mencegah kepotong, tapi rawan menabrak teks atas/bawah."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <input type="range" id="pad_y" min="0" max="1.5" step="0.05" value="0.25">
            </div>

            <div class="settings-group">
              <label for="skala_potongan">Skala (<span id="val_skala">2.0</span>) <span class="info-icon" data-tooltip="Faktor perbesaran gambar sebelum dikirim ke AI. (Default: 2.0)&#10;Effect: Makin besar teks makin terbaca AI, tapi proses lambat."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <input type="range" id="skala_potongan" min="1.0" max="5.0" step="0.1" value="2.0">
            </div>

            <div class="settings-group">
              <label for="min_pad">Min Pad px (<span id="val_min_pad">35</span>) <span class="info-icon" data-tooltip="Batas kelonggaran minimum dalam piksel. (Default: 35)&#10;Effect: Mencegah potongan AI terlalu sempit pada teks super kecil."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <input type="range" id="min_pad" min="0" max="150" step="1" value="35">
            </div>

            <div class="settings-group">
              <label for="mask_margin">Mask Margin (<span id="val_mask">0.12</span>) <span class="info-icon" data-tooltip="Rasio penyempitan area kotak putih masking. (Default: 0.12)&#10;Effect: Makin kecil = kotak putih membesar."><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span></label>
              <input type="range" id="mask_margin" min="0" max="0.45" step="0.01" value="0.12">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-config-btn" class="primary-btn">Save Configuration</button>
        </div>
      </div>
    </div>
  </body>
</html>
